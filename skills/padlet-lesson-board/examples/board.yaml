# board.json과 같은 내용입니다.
# yaml로 쓰려면 js-yaml이 필요합니다. 없으면 board.json을 쓰세요.

보드제목: 표정으로 말해요

섹션:
  - 이름: 표정 풀기
    카드:
      - 제목: 거울 보고 따라 하기
        본문: 짝과 번갈아 표정을 지어 봅니다.
      - 제목: 지금 내 표정은
        질문: 어떤 표정에 가깝나요
        투표: [웃는 얼굴, 놀란 얼굴, 찡그린 얼굴]

  - 이름: 어울리는 말 고르기
    카드:
      - 제목: 친구가 넘어졌어요
        질문: 어떤 말을 할까요
        투표: [괜찮아?, 같이 가자, 여기 앉아]
        색: blue
      - 제목: 친구가 상을 받았어요
        질문: 어떤 말을 할까요
        투표: [축하해, 잘했어, 멋지다]
        색: green

  - 이름: 고른 이유
    카드:
      - 제목: 왜 그 말을 골랐나요
        본문: 짝에게 한 문장으로 말해 봅니다. 말하기 어려우면 카드를 짚어도 됩니다.

  - 이름: 오늘 나는
    카드:
      - 제목: 스스로 점검
        질문: 오늘 활동은 어땠나요
        투표: [잘했어요, 조금 더, 도움이 필요해요]
        색: purple
